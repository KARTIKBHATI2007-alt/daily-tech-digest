<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tech Digest</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
        }
        p {
            line-height: 1.6;
            color: #cbd5e1;
        }
        .status {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="status">Live Dashboard</span>
        <h1>🚀 Daily Tech Digest</h1>
        <p>Welcome to your personal automated daily tech news and AI research digest!</p>
        <hr style="border: 0.5px solid #334155; margin: 20px 0;">
        <p>Check back daily for updated summaries from Hacker News, arXiv, and Gemini API pipeline.</p>
    </div>
</body>
</html>

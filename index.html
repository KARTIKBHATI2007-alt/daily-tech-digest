<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tech Search Engine — Daily Tech Digest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      margin-bottom: 2rem;
    }

    .brand { font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
    .status-badge {
      font-size: 0.8rem;
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      border: 1px solid rgba(52, 211, 153, 0.2);
    }

    .search-container { margin-bottom: 1.5rem; }

    .search-box-wrap {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .search-input {
      flex: 1;
      padding: 0.9rem 1.25rem;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn {
      padding: 0.9rem 1.5rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .hashtags { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .tag-btn {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .tag-btn:hover { background: var(--accent); color: #000; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .card-hashtag {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .card-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.75rem; line-height: 1.4; }
    .card-snippet { font-size: 0.88rem; color: var(--muted); margin-bottom: 1rem; line-height: 1.5; }
    .card-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; }

    .loader { text-align: center; padding: 3rem; color: var(--muted); grid-column: 1 / -1; }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">⚡ Live Tech Search Engine</div>
      <div class="status-badge">● Live Web Stream Active</div>
    </header>

    <div class="search-container">
      <div class="search-box-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="Search topic (e.g. LLM, Tesla, AI, WebDev)..." onkeydown="if(event.key==='Enter') executeLiveSearch()">
        <button class="btn" onclick="executeLiveSearch()">Search News</button>
      </div>

      <div class="hashtags">
        <span style="font-size: 0.85rem; color: var(--muted); margin-right: 0.3rem;">Trending:</span>
        <button class="tag-btn" onclick="quickSearch('AI')">#AI</button>
        <button class="tag-btn" onclick="quickSearch('LLM')">#LLM</button>
        <button class="tag-btn" onclick="quickSearch('Tesla')">#Tesla</button>
        <button class="tag-btn" onclick="quickSearch('WebDev')">#WebDev</button>
        <button class="tag-btn" onclick="quickSearch('Cybersecurity')">#Cybersecurity</button>
      </div>
    </div>

    <div id="resultsGrid" class="grid">
      <div class="loader">Loading live tech updates...</div>
    </div>

    <footer>
      Built by Kartik Bhati • Realtime News Search Engine
    </footer>
  </div>

  <script>
    async function executeLiveSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = `<div class="loader">Searching live news for "<b>${query}</b>"...</div>`;

      try {
        // Reliable CORS Proxy + Google News RSS Fetching
        const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&hl=en-US&gl=US&ceid=US:en`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
        
        const response = await fetch(proxyUrl);
        const data = await response.json();
        
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data.contents, "text/xml");
        const items = Array.from(xmlDoc.querySelectorAll("item"));

        if (items.length > 0) {
          renderSearchResults(items, query);
        } else {
          grid.innerHTML = `<div class="loader">No live news found for "${query}". Try another term.</div>`;
        }
      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="loader" style="color: #ef4444;">Failed to load live search results. Please try again.</div>`;
      }
    }

    function renderSearchResults(items, query) {
      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = items.slice(0, 12).map(item => {
        const title = item.querySelector("title")?.textContent || "No Title";
        const link = item.querySelector("link")?.textContent || "#";
        const pubDateText = item.querySelector("pubDate")?.textContent;
        const pubDate = pubDateText ? new Date(pubDateText).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Recent';

        return `
          <div class="card">
            <div>
              <div class="card-hashtag">#${query.toUpperCase().replace(/\s+/g, '')} • ${pubDate}</div>
              <div class="card-title">${title}</div>
            </div>
            <a href="${link}" target="_blank" rel="noopener" class="card-link">Read Source Article →</a>
          </div>
        `;
      }).join('');
    }

    function quickSearch(tag) {
      document.getElementById('searchInput').value = tag;
      executeLiveSearch();
    }

    // Default Load
    quickSearch('AI');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Tech Digest — Developer Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      margin-bottom: 2rem;
    }

    .brand { font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
    .status-badge {
      font-size: 0.8rem;
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      border: 1px solid rgba(52, 211, 153, 0.2);
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .search-input {
      flex: 1;
      padding: 0.8rem 1.2rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
    }

    .search-input:focus { border-color: var(--accent); }

    .btn {
      padding: 0.8rem 1.2rem;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .card-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.75rem; line-height: 1.4; }
    .card-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }
    .card-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; }

    .loader {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">⚡ Daily Tech Digest</div>
      <div class="status-badge">● Live API Connected</div>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search live stories, topics, frameworks..." oninput="filterNews()">
      <button class="btn" onclick="fetchLiveNews()">↻ Refresh News</button>
    </div>

    <div id="newsGrid" class="grid">
      <div class="loader">Fetching latest tech stories...</div>
    </div>

    <footer>
      Built by Kartik Bhati • Powered by HackerNews Live API
    </footer>
  </div>

  <script>
    let allStories = [];

    async function fetchLiveNews() {
      const grid = document.getElementById('newsGrid');
      grid.innerHTML = '<div class="loader">Fetching latest tech stories...</div>';
      
      try {
        const res = await fetch('https://hacker-news.firebaseio.com/v0/topstories.json');
        const ids = await res.json();
        const topIds = ids.slice(0, 12);

        const storyPromises = topIds.map(id => 
          fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json())
        );

        allStories = await Promise.all(storyPromises);
        renderStories(allStories);
      } catch (err) {
        grid.innerHTML = '<div class="loader" style="color: #ef4444;">Failed to load live news. Click refresh to try again.</div>';
      }
    }

    function renderStories(stories) {
      const grid = document.getElementById('newsGrid');
      if (stories.length === 0) {
        grid.innerHTML = '<div class="loader">No matching news found.</div>';
        return;
      }

      grid.innerHTML = stories.map(s => `
        <div class="card">
          <div>
            <div class="card-title">${s.title}</div>
            <div class="card-meta">By ${s.by} • ${s.score} points</div>
          </div>
          <a href="${s.url || 'https://news.ycombinator.com/item?id=' + s.id}" target="_blank" class="card-link">Read Story →</a>
        </div>
      `).join('');
    }

    function filterNews() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allStories.filter(s => s.title.toLowerCase().includes(query));
      renderStories(filtered);
    }

    fetchLiveNews();
  </script>
</body>
</html>
